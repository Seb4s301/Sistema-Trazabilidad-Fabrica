spring:
  application:
    name: erp-produccion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/latin_dream}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # Zona horaria de operación: America/Lima
  jackson:
    timezone: America/Lima

server:
  port: 8080

# Seguridad JWT
jwt:
  secret: ${JWT_SECRET:c2VjcmV0LXJhbmRvbS1wYXJhLXBlcnV0b3MtdG90b2Rv}
  expiration: 86400000 # 24 horas en milisegundos

# Prefijo de API
api:
  prefix: /api/v1

