spring:
  application:
    name: erp-produccion
  config:
    # Carga el .env de la raíz del repo (o el de backend/) como propiedades.
    # Así "mvn spring-boot:run" usa DB_URL, DB_USER, etc. sin exportarlas a mano.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  # Zona horaria de operación: America/Lima (Perú)
  jackson:
    timezone: America/Lima

server:
  port: ${SERVER_PORT:8080}

# Seguridad JWT
jwt:
  # ⚠️ En producción usa una clave de al menos 32 caracteres (256 bits)
  secret: ${JWT_SECRET:c2VjcmV0LXJhbmRvbS1wYXJhLXBlcnV0b3MtdG90b2Rv}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos

# Prefijo de API
api:
  prefix: ${API_PREFIX:/api/v1}

# Orígenes permitidos para CORS (separados por coma). En producción: dominio del frontend
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201}

# Semilla de usuarios de prueba (SOLO DESARROLLO)
# Se crea solo si la tabla usuarios está vacía. En producción: enabled: false
