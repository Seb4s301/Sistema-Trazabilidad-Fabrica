<header class="app-header d-flex align-items-center justify-content-between">
  <!-- Breadcrumb -->
  <div class="breadcrumb-text d-none d-md-block">
    <span class="muted">{{ breadcrumb }} /</span>
    <span class="current">{{ pageTitle }}</span>
  </div>

  <!-- Logo móvil -->
  <div class="mobile-brand d-md-none">
    <div class="logo-mark">LD</div>
    <span class="brand-name">Latin Dream</span>
  </div>

  <!-- Derecha: fecha, lupa, campana, turno -->
  <div class="header-right d-flex align-items-center">
    <span class="header-date d-none d-sm-inline">{{ today }}</span>
    <button type="button" class="icon-btn" title="Buscar">🔍</button>
    <button type="button" class="icon-btn" title="Notificaciones">🔔</button>
    <span class="shift-chip">Turno A</span>
    <div class="avatar d-none d-lg-flex">M</div>
  </div>
</header>
