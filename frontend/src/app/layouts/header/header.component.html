<header class="app-header">
  <!-- Breadcrumb (escritorio) -->
  <div class="breadcrumb-text d-none d-md-flex">
    <span class="breadcrumb-icon">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </span>
    <span class="muted">{{ breadcrumb }}</span>
    <span class="breadcrumb-sep">/</span>
    <span class="current">{{ pageTitle }}</span>
  </div>

  <!-- Logo móvil -->
  <div class="mobile-brand d-md-none">
    <div class="logo-mark">LD</div>
    <span class="brand-name">Latin Dream</span>
  </div>

  <!-- Derecha: fecha, iconos, turno -->
  <div class="header-right">
    <span class="header-date d-none d-sm-inline">{{ today }}</span>

    <button type="button" class="icon-btn" title="Buscar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>

    <button type="button" class="icon-btn" title="Notificaciones">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>

    <span class="shift-chip">
      <span class="shift-dot"></span>Turno A
    </span>
  </div>
</header>
