<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-mark">LD</div>
    <div class="logo-text">
      <span class="logo-title">Latin Dream</span>
      <span class="logo-subtitle">GESTIÓN INDUSTRIAL</span>
    </div>
  </div>

  <!-- Sección -->
  <div class="sidebar-section">ESPACIO DE TRABAJO</div>

  <!-- Navegación -->
  <nav class="sidebar-nav">
    <a routerLink="/resumen" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg class="nav-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
        </svg>
      </span>
      <span class="nav-text">Resumen</span>
    </a>

    <a routerLink="/ordenes" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg class="nav-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      </span>
      <span class="nav-text">Órdenes</span>
    </a>

    <a routerLink="/produccion" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg class="nav-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </span>
      <span class="nav-text">Producción</span>
      <span class="badge-count">{{ lotesEnPlanta }}</span>
    </a>

    <a routerLink="/comisiones" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg class="nav-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
      </span>
      <span class="nav-text">Comisiones</span>
    </a>

    <a routerLink="/despacho" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg class="nav-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </span>
      <span class="nav-text nav-text-multiline">Despacho y<br>Transporte</span>
    </a>
  </nav>

  <!-- Tarjeta de planta -->
  <div class="plant-card">
    <div class="plant-label">PLANTA PRINCIPAL</div>
    <div class="plant-shift">Turno A · 06:00–14:00</div>
    <div class="plant-status">
      <span class="status-dot"></span>
      <span>Sistema en línea</span>
    </div>
  </div>

  <!-- Área de trabajo -->
  <div class="sidebar-area-label">Área de trabajo</div>

  <!-- Perfil -->
  <div class="user-profile" *ngIf="authService.getUsuario() as u">
    <div class="avatar">{{ u.nombre.charAt(0) }}</div>
    <div class="user-info">
      <div class="user-name" [title]="u.nombre">{{ u.nombre }}</div>
      <div class="user-role" [title]="u.rol">{{ u.rol }}</div>
    </div>
    <button class="settings-btn" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
</aside>
